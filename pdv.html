<script>

let sb=null; /* biblioteca do Supabase: só é carregada no modo online (sem servidor local) */
async function ensureSb(){
  if(sb)return sb;
  if(!window.supabase)await new Promise(ok=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=ok;s.onerror=ok;document.head.appendChild(s);setTimeout(ok,15000)});

/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const R=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=(n,d=3)=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12);
const r2=n=>Math.round((+n||0)*100)/100;
const r3=n=>Math.round((+n||0)*1000)/1000;
const digits=v=>String(v||'').replace(/\D/g,'');
const num=s=>{s=String(s??'').trim().replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const f2=n=>(+n||0).toFixed(2).replace('.',',');
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const fmtTel=v=>{const d=digits(v);return d.length==11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length==10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:String(v||'')};
const fmtDoc=v=>{const d=digits(v);return d.length==11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):d.length==14?d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):d};
function cpfOk(c){c=digits(c);if(c.length!=11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if(((s*10)%11)%10!=c[t])return false}return true}
function cnpjOk(c){c=digits(c);if(c.length!=14||/^(\d)\1+$/.test(c))return false;const dv=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return dv(12)==c[12]&&dv(13)==c[13]}
const docOk=v=>{const d=digits(v);return d.length==11?cpfOk(d):d.length==14?cnpjOk(d):false};
function authEmail(v){v=String(v).trim().toLowerCase();if(v.includes('@'))return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?v:'';let d=digits(v);if(d.length>=10&&d.length<=11)d='55'+d;return d.length>=12&&d.length<=13?d+FAKE:''}
const isNet=e=>!navigator.onLine||/fetch|network|load failed|timeout|aborted/i.test(String((e&&e.message)||e));
let AC=null;
function tone(f,d,type='sine',g=.15){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),n=AC.createGain(),a=AC.currentTime;o.type=type;o.frequency.value=f;n.gain.setValueAtTime(g,a);n.gain.exponentialRampToValueAtTime(.0001,a+d);o.connect(n);n.connect(AC.destination);o.start(a);o.stop(a+d+.02)}catch(e){}}
const beepOk=()=>tone(1500,.08,'square',.06);
const beepErr=()=>{tone(300,.18,'square',.12);setTimeout(()=>tone(220,.25,'square',.12),190)};
let tt=null;
function toast(t,k=''){let b=$('#toast');if(!b){b=document.createElement('div');b.id='toast';document.body.appendChild(b)}b.className='toast '+k;b.textContent=t;b.hidden=false;clearTimeout(tt);tt=setTimeout(()=>b.hidden=true,k?5000:2600)}

/* ===== ajustes deste caixa (ficam neste computador) ===== */
const CFG0={pdv:'Caixa 1',op:'',auto:true,ps:1,bal:{on:true,pre:'2',ci:1,cl:4,vi:7,vl:5,tipo:'preco',dec:2}};
let C=load('pdvcfg',{});C={...CFG0,...C,bal:{...CFG0.bal,...(C.bal||{})}};
const saveC=()=>store('pdvcfg',C);

/* ===== estado ===== */
let EMP={n:'Mercado Mezzomo',cnpj:'',e:'Rua Jair Antonio Fortes, nº 626',c:'Novo Progresso/PA',tel:'',msg:'Obrigado pela preferência!\nDeus seja louvado',logo:'',lw:40,th:165,pix:'',pixT:'cnpj'};
Object.assign(EMP,load('mkcfg',{}));
let user=null,P=load('pdvprod',[]),pend=[],clients=null,online=navigator.onLine;
let cart=[],sel=-1,disc={t:'v',v:0},cli=null,ord=null,mult=null,sgList=[],sgSel=-1,M=null,PG=null,busy=false;
let Q=load('pdvq',[]),QE=load('pdvqerr',[]),flushing=false;
(()=>{const s=load('pdvcart',null);if(s&&Array.isArray(s.cart)){cart=s.cart;disc=s.disc||disc;cli=s.cli||null;ord=s.ord||null;sel=cart.length-1}})();
const saveCart=()=>store('pdvcart',{cart,disc,cli,ord});
const saveQ=()=>{store('pdvq',Q);store('pdvqerr',QE)};
const stk=p=>(p.est===''||p.est==null||isNaN(+p.est))?null:+p.est;
const lineTot=l=>l.tot!=null?r2(l.tot):r2(l.p*l.q);
const sub=()=>r2(cart.reduce((s,l)=>s+lineTot(l),0));
const descV=()=>{const s=sub();return disc.t=='p'?r2(s*Math.min(100,+disc.v||0)/100):Math.min(r2(disc.v),s)};
const taxa=()=>ord&&ord.ent!='retirada'?r2(ord.taxa||0):0;
const total=()=>r2(sub()-descV()+taxa());
const qtd=()=>cart.length;
const opName=()=>C.op||(user&&user.email?user.email.split('@')[0]:'');

/* ===== login ===== */
function loginView(msg){
  $('#root').innerHTML=`<div class="card login"><img src="${esc(EMP.logo||'logo.png')}" alt="" onerror="this.style.display='none'"><h2 style="margin:8px 0 2px">PDV do balcão</h2><p class="mu" style="color:var(--mu);margin:0 0 10px">${esc(EMP.n)}</p>

  <label>E-mail ou WhatsApp</label><input id="le" autocomplete="username" autofocus>
  <label>Senha</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()">

  setTimeout(()=>$('#le')&&$('#le').focus(),50);

async function login(){
  const v=$('#le').value,err=await API.login(authEmail(v)||v.trim(),$('#lp').value);
  if(err)return loginView(err);
  init();
}
async function sair(){
  if(cart.length&&!confirm('Há uma venda em andamento. Sair mesmo assim?'))return;
  try{await API.logout()}catch(e){return alert(e.message)}
  localStorage.removeItem('pdvadm');location.reload();

/* ===== camada de dados: servidor local do caixa OU nuvem (Supabase) ===== */
let LOCAL=false,LS=null;
const L={
  async get(p){const r=await fetch(p,{cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'HTTP '+r.status);return j},

/* ===== busca e leitura ===== */
function byCode(t){
  t=String(t).trim();if(!t)return null;
  const d=digits(t);
  return P.find(p=>p.bar&&String(p.bar).trim()==t)||P.find(p=>p.cod&&String(p.cod).trim()==t)
    ||(d&&d==t?P.find(p=>(p.bar&&digits(p.bar).replace(/^0+/,'')==d.replace(/^0+/,''))||(p.cod&&digits(p.cod)&&digits(p.cod).replace(/^0+/,'')==d.replace(/^0+/,''))):null)||null;
}
function scale(t){
  const B=C.bal;if(!B.on||!/^\d{13}$/.test(t)||!t.startsWith(B.pre))return null;
  const code=t.substr(B.ci,B.cl),val=parseInt(t.substr(B.vi,B.vl),10)/Math.pow(10,+B.dec||0);
  if(!code||isNaN(val)||val<=0)return null;
  const cn=parseInt(code,10);
  const p=P.find(x=>x.cod&&digits(x.cod)&&parseInt(digits(x.cod),10)==cn)||P.find(x=>x.bar&&digits(x.bar)==code);
  if(!p)return {miss:code};
  if(B.tipo=='peso')return {p,q:r3(val)};
  const pr=+p.p||0;return {p,q:pr?r3(val/pr):1,tot:r2(val)};
}
function search(t){
  const w=norm(t).split(/\s+/).filter(Boolean);if(!w.length)return [];
  const h=p=>norm(p.n+' '+(p.cod||'')+' '+(p.bar||'')+' '+(p.c||''));
  const st=norm(t);
  return P.filter(p=>{const s=h(p);return w.every(x=>s.includes(x))}).sort((a,b)=>(norm(b.n).startsWith(st)-norm(a.n).startsWith(st))||a.n.localeCompare(b.n,'pt-BR')).slice(0,12);
}
function sug(){
  const i=$('#in'),t=i.value.trim().replace(/^\d+(?:[.,]\d+)?\s*[*xX]\s*/,'');
  if(t.length<2||(/^\d+$/.test(t)&&t.length>=7)){hideSg();return}
  sgList=search(t);sgSel=sgList.length?0:-1;drawSg();
}
function drawSg(){
  const g=$('#sg');if(!sgList.length){g.hidden=true;return}
  g.hidden=false;
  g.innerHTML=sgList.map((p,i)=>{const s=stk(p);return `<div class="${i==sgSel?'on':''}" onmousedown="event.preventDefault();pickSg(${i})"><span><b>${esc(p.n)}</b><br><small>${esc(p.cod?'cód. '+p.cod:'')}${p.bar?' · '+esc(p.bar):''}${s!==null?' · estoque '+N(s):''}</small>${s!==null&&s<=0?' <span class="z">SEM ESTOQUE</span>':''}</span><b class="num">${R(p.p)}<small> /${esc(p.u||'un')}</small></b></div>`}).join('');
  const on=g.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});
}
function hideSg(){sgList=[];sgSel=-1;const g=$('#sg');if(g)g.hidden=true}
function pickSg(i){const p=sgList[i];if(!p)return;const q=takeQ();clearIn();askWeight(p,q)}
function takeQ(){const m=/^(\d+(?:[.,]\d+)?)\s*[*xX]/.exec($('#in').value.trim());if(m)return num(m[1]);const q=mult;return q}
function clearIn(){const i=$('#in');if(i)i.value='';hideSg();mult=null;const m=$('#mt');if(m)m.hidden=true}
function setMult(q){mult=q;const m=$('#mt');m.hidden=false;m.textContent=N(q)+' ×'}
function askWeight(p,q){if(!q&&p.u=='kg')return qtyM(null,p);addP(p,q||1)}
function onEnter(){
  const i=$('#in');let t=i.value.trim();
  if(!t){if(cart.length)pagar();return}
  let q=mult;const m=/^(\d+(?:[.,]\d+)?)\s*[*xX]\s*(.*)$/.exec(t);
  if(m){q=num(m[1]);t=m[2].trim();if(!(q>0)){beepErr();return toast('Quantidade inválida.','er')}if(!t){i.value='';hideSg();setMult(q);return}}
  const sc=scale(t);
  if(sc&&sc.p){clearIn();addP(sc.p,sc.q,{tot:sc.tot});return}
  const p=byCode(t);
  if(p){clearIn();askWeight(p,q);return}
  if(sc&&sc.miss){beepErr();toast('Etiqueta de balança: produto de código '+sc.miss+' não cadastrado.','er');i.select();return}
  if(sgList.length&&sgSel>=0){const s=sgList[sgSel];clearIn();askWeight(s,q);return}
  const l=search(t);
  if(l.length==1){clearIn();askWeight(l[0],q);return}
  if(l.length){sgList=l;sgSel=0;drawSg();return}
  beepErr();toast('Produto não encontrado: '+t,'er');i.select();
}
function addP(p,q=1,o={}){
  if(!p)return;
  q=r3(q);if(!(q>0))return;
  const s=stk(p);
  if(s!==null){const ja=cart.filter(l=>l.pid==p.id).reduce((a,l)=>a+l.q,0);if(ja+q>s)toast(`⚠️ ${p.n}: o sistema mostra ${N(s)} em estoque. Venda registrada mesmo assim — confira o estoque depois.`,'wn')}
  const last=cart[cart.length-1];
  const pr=o.p!=null?r2(o.p):(+p.p||0);
  if(o.tot==null&&last&&last.pid==p.id&&last.tot==null&&last.p==pr&&p.u!='kg'){last.q=r3(last.q+q);sel=cart.length-1}
  else{cart.push({k:uid(),pid:p.id,n:p.n,u:p.u||'un',p:pr,q,tot:o.tot??null,cod:p.cod||'',bar:p.bar||''});sel=cart.length-1}
  beepOk();render();focusIn();
}
function delLine(i){
  if(i==null)i=sel>=0?sel:cart.length-1;

}

/* quantidade / preço do item */
function qtyLine(){
  const v=$('#in').value.trim();
  if(/^\d+(?:[.,]\d+)?$/.test(v)&&v.length<6&&num(v)>0){setMult(num(v));$('#in').value='';hideSg();toast('Quantidade '+v+' para o próximo item.');return}
  if(!cart.length)return toast('Digite a quantidade e aperte F3, ou use 3* antes do código.');

}
function qtyM(i,prod){
  const l=i!=null?cart[i]:null,p=prod||(l&&P.find(x=>x.id==l.pid));
  const nm=l?l.n:p.n,u=l?l.u:(p.u||'un'),pr=l?l.p:+p.p;
  openM(`<h3>${l?'Alterar item':'Quantidade'}</h3><p class="mu">${esc(nm)}</p>
  <div class="g2"><div><label>Quantidade (${esc(u)})</label><input id="mq" class="pgv" inputmode="decimal" value="${l?String(l.q).replace('.',','):''}" placeholder="${u=='kg'?'0,000':'1'}" autofocus></div>
  <div><label>Preço unitário</label><input id="mp" class="pgv" inputmode="decimal" value="${f2(pr)}"></div></div>
  <p class="mu" id="mtot" style="text-align:right;font-size:16px"></p>
  <div class="mb"><button class="b s" onclick="closeM()"><kbd>Esc</kbd> Voltar</button><button class="b" onclick="qtyOk()"><kbd>Enter</kbd> Confirmar</button></div>`,
  {key:e=>{if(e.key=='Enter'){e.preventDefault();qtyOk()}}});
  const up=()=>{const q=num($('#mq').value),pp=num($('#mp').value);$('#mtot').textContent=q>0&&pp>=0?'Total do item: '+R(r2(q*pp)):''};
  $('#mq').oninput=up;$('#mp').oninput=up;up();
  window.qtyOk=()=>{
    const q=r3(num($('#mq').value)),pp=r2(num($('#mp').value));
    if(!(q>0))return toast('Informe a quantidade.','er');
    if(!(pp>=0))return toast('Preço inválido.','er');
    closeM(true);
    if(l){const ch=q!=l.q||pp!=l.p;l.q=q;if(pp!=l.p)l.p=pp;if(ch)l.tot=null;render()}
    else addP(p,q,pp!=+p.p?{p:pp}:{});
  };
}

/* desconto */
function descM(){

const FORMAS=[['F1','Dinheiro','💵'],['F2','Pix','💠'],['F3','Débito','💳'],['F4','Crédito','💳']];
const pgPago=()=>r2(PG.list.reduce((s,g)=>s+g.v,0));
const pgRest=()=>r2(total()-pgPago());
const pgTroco=()=>r2(PG.list.filter(g=>g.f=='Dinheiro').reduce((s,g)=>s+((g.r||g.v)-g.v),0));
function pagar(){
  if(!cart.length)return toast('Nenhum item na venda.');
  if(total()<0)return toast('O desconto é maior que a venda.','er');
  const map={Dinheiro:'Dinheiro',Pix:'Pix','Cartão':'Crédito','Débito':'Débito','Crédito':'Crédito'};
  PG={list:[],ent:false,pr:C.auto,last:ord&&map[ord.pay]?map[ord.pay]:'Dinheiro'};
  openM('<div id="pgw"></div>',{cls:'wide',sticky:true,key:pgKey});drawPg();
}
function drawPg(keep){
  const rest=pgRest(),tr=pgTroco(),pix=PG.list.filter(g=>g.f=='Pix').pop();
  const val=keep!=null?keep:(rest>0?f2(rest):'');
  $('#pgw').innerHTML=`<h3>Pagamento ${ord?'· pedido #'+esc(ord.id.slice(-4).toUpperCase()):''}</h3>
  <div class="pgt"><div><small>TOTAL</small><b>${R(total())}</b></div><div><small>RECEBIDO</small><b>${R(pgPago()+tr)}</b></div>${rest>0.004?`<div class="rd"><small>FALTA</small><b>${R(rest)}</b></div>`:`<div class="ok"><small>TROCO</small><b>${R(tr)}</b></div>`}</div>
  ${rest>0.004?`<label>Valor recebido nesta forma (Enter usa ${esc(PG.last)})</label><input id="pgv" class="pgv" inputmode="decimal" value="${val}" autofocus>
  <div class="fp">${FORMAS.map(([k,f,ic])=>`<button class="b ${f==PG.last?'':'s'}" onclick="addPg('${f}')"><span>${ic} ${f}</span><kbd>${k}</kbd></button>`).join('')}</div>`:''}
  ${PG.list.map((g,i)=>`<div class="row"><span>${esc(g.f)}${g.r&&g.r!=g.v?` <small style="color:var(--mu)">(recebido ${R(g.r)})</small>`:''}</span><span class="num"><b>${R(g.v)}</b> <button class="x" onclick="PG.list.splice(${i},1);drawPg()" title="Remover">✕</button></span></div>`).join('')}
  ${pix&&pixCode({id:ord?ord.id:'BALCAO',total:pix.v})?`<div class="qr" id="pgqr"></div>`:''}
  ${ord&&ord.ent!='retirada'?`<label class="ck"><input type="checkbox" ${PG.ent?'checked':''} onchange="PG.ent=this.checked"> O pedido já foi entregue ao cliente</label>`:''}
  <label class="ck"><input type="checkbox" ${PG.pr?'checked':''} onchange="PG.pr=this.checked"> Imprimir cupom</label>
  <p class="mu" style="margin:8px 0 0">${cli&&cli.cpf?'CPF/CNPJ na nota: <b>'+fmtDoc(cli.cpf)+'</b>':'Sem CPF na nota (F6 antes do pagamento para incluir).'}</p>
  <div class="mb"><button class="b s" onclick="closeM()"><kbd>Esc</kbd> Voltar à venda</button><button class="b ok" style="min-height:52px;font-size:17px" ${rest>0.004?'disabled':''} onclick="faturar()"><kbd>Enter</kbd> Finalizar venda</button></div>`;
  if(pix){const q=qrMatrix(pixCode({id:ord?ord.id:'BALCAO'+Date.now().toString(36),total:pix.v})),e=$('#pgqr');if(q&&e){e.innerHTML=qrSvg(q)+`<div><b style="font-size:18px">Pix ${R(pix.v)}</b><span>${esc(EMP.n)}</span><small>Peça para o cliente ler o QR Code e confira o recebimento no banco antes de finalizar.</small></div>`}}
  const i=$('#pgv');if(i)setTimeout(()=>{i.focus();i.select()},20);

function addPg(f){
  const rest=pgRest();if(rest<=0.004)return;
  let v=num($('#pgv')&&$('#pgv').value);if(!(v>0))v=rest;
  if(f!='Dinheiro'&&v>rest+0.004){toast(f+' não pode passar do valor que falta. Usei '+R(rest)+'.','wn');v=rest}
  const ap=r2(Math.min(v,rest));
  PG.list.push({f,v:ap,...(f=='Dinheiro'?{r:r2(v)}:{})});PG.last=f;drawPg();
}
function pgKey(e){
  const fk=FORMAS.find(x=>x[0]==e.key);
  if(fk){e.preventDefault();addPg(fk[1]);return}
  if(e.key=='Enter'){e.preventDefault();if(pgRest()<=0.004)faturar();else addPg(PG.last);return}
  if(e.key=='Backspace'&&(!$('#pgv')||!$('#pgv').value)&&PG.list.length){e.preventDefault();PG.list.pop();drawPg()}
}
async function faturar(){
  if(busy||pgRest()>0.004)return;busy=true;
  try{
    const now=new Date().toISOString(),fat={id:uid(),date:now,op:opName(),pdv:C.pdv};
    const pags=PG.list.map(g=>({...g})),din=pags.filter(g=>g.f=='Dinheiro');
    const cash=r2(din.reduce((s,g)=>s+(g.r||g.v),0)),troco=pgTroco(),forms=[...new Set(pags.map(g=>g.f))];
    const st=!ord||ord.ent=='retirada'||PG.ent?'ent':'conf';
    const items=cart.map(l=>({pid:l.pid,n:l.n,u:l.u,p:l.p,q:l.q,t:lineTot(l)}));
    const id=ord?ord.id:uid();
    const base=ord?{}:{date:now,cn:cli&&cli.n?cli.n:'Consumidor',ph:cli?cli.ph||'':'',addr:'Venda no balcão',ent:'retirada',bairro:'',canal:'balcao',obs:'',...(cli&&cli.id?{cli_id:cli.id}:{})};
    const data={...base,items,sub:sub(),desc:descV(),taxa:taxa(),total:total(),pags,pay:forms.length==1?forms[0]:'Misto',cash,troco,st,done:st=='ent',fat,...(cli&&cli.cpf?{cpf:digits(cli.cpf)}:{})};
    const res=await API.faturar(id,data);
    let off=false;
    if(res.error){
      if(isNet(res.error)){Q.push({id,data});saveQ();setOnline(false);off=true}
      else{busy=false;return alert('Não foi possível faturar: '+(res.error.message||res.error))}
    }else setOnline(true);
    const fin={...(ord||{}),...data,id};
    if(!ord)cart.forEach(l=>{const p=P.find(x=>x.id==l.pid),s=p&&stk(p);if(p&&s!==null)p.est=Math.max(0,r3(s-l.q))});
    store('pdvlast',fin);
    if(ord)pend=pend.filter(o=>o.id!=ord.id);
    const pr=PG.pr;closeM(true);resetSale();
    if(pr)printCupom(fin);
    doneM(fin,off);
    if(!off)setTimeout(loadProducts,800);
  }finally{busy=false}
}
function doneM(o,off){
  openM(`<div class="done"><div style="font-size:46px">✅</div><h3>${o.canal=='balcao'?'Venda':'Pedido'} #${esc(o.id.slice(-4).toUpperCase())} ${o.canal=='balcao'?'finalizada':'faturado'}</h3>

  <div class="mb" style="justify-content:center"><button class="b" autofocus onclick="closeM()"><kbd>Enter</kbd> Próximo cliente</button></div></div>`,
  {key:e=>{if(e.key=='Enter'){e.preventDefault();closeM()}}});

/* ===== fila offline ===== */
async function flushQ(){
  if(!Q.length||flushing||(!LOCAL&&!sb))return;flushing=true;
  try{
    for(const it of [...Q]){
      const r=await API.faturar(it.id,it.data);
      if(r.error){
        if(isNet(r.error)){setOnline(false);break}
        it.err=String(r.error.message||r.error);QE.push(it);toast('⚠️ Venda #'+it.id.slice(-4).toUpperCase()+' não foi aceita: '+it.err,'er');
      }else setOnline(true);
      Q=Q.filter(x=>x!==it);saveQ();
    }
  }finally{flushing=false;hdr()}
}

const TIPO={abertura:'Abertura (fundo de troco)',suprimento:'Suprimento',sangria:'Sangria',despesa:'Despesa'};
const hoje0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
async function caixaDia(){
  const t0=hoje0(),d=await API.dia();
  const mv=d.mv.filter(m=>m&&new Date(m.date)>=t0).sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  const os=d.os.filter(o=>o&&o.fat&&new Date(o.fat.date)>=t0);
  const pay={};let din=0,fat=0;
  os.forEach(o=>{fat+=+o.total||0;(o.pags||[]).forEach(g=>{pay[g.f]=pay[g.f]||{n:0,v:0};pay[g.f].n++;pay[g.f].v+=+g.v||0;if(g.f=='Dinheiro')din+=+g.v||0})});
  const sm=t=>mv.filter(m=>m.tipo==t).reduce((s,m)=>s+(+m.valor||0),0);
  const ab=sm('abertura'),su=sm('suprimento'),sa=sm('sangria'),de=sm('despesa');
  return {mv,os,pay,din:r2(din),fat:r2(fat),ab,su,sa,de,gav:r2(ab+su+din-sa-de)};
}

const bwCache={};
function bwLogo(src,th,lw){
  return new Promise(res=>{
    const k=String(src).slice(-60)+'|'+th+'|'+lw;if(bwCache[k])return res(bwCache[k]);
    const im=new Image();
    im.onload=()=>{
      const w=Math.max(120,Math.round(lw*8)),h=Math.round(im.height/im.width*w),c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      const d=x.getImageData(0,0,w,h),p=d.data,n=w*h,bg=new Uint8Array(n),st=[];
      const add=i=>{if(!bg[i]){bg[i]=1;st.push(i)}};
      for(let i=0;i<w;i++){add(i);add((h-1)*w+i)}for(let j=0;j<h;j++){add(j*w);add(j*w+w-1)}
      while(st.length){const i=st.pop(),xx=i%w,yy=(i-xx)/w;
        for(const j of [xx>0?i-1:-1,xx<w-1?i+1:-1,yy>0?i-w:-1,yy<h-1?i+w:-1]){if(j<0||bg[j])continue;if(Math.abs(p[i*4]-p[j*4])+Math.abs(p[i*4+1]-p[j*4+1])+Math.abs(p[i*4+2]-p[j*4+2])<24)add(j)}}
      const g=new Float32Array(n),off=th-165;
      for(let i=0;i<n;i++)g[i]=bg[i]?255:Math.max(0,Math.min(255,.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2]-off));
      for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=y*w+xx,o=g[i],v=o<128?0:255,e=o-v;g[i]=v;
        if(xx+1<w)g[i+1]+=e*7/16;if(y+1<h){if(xx>0)g[i+w-1]+=e*3/16;g[i+w]+=e*5/16;if(xx+1<w)g[i+w+1]+=e/16}}
      for(let i=0;i<n;i++){const v=g[i]<128?0:255;p[i*4]=p[i*4+1]=p[i*4+2]=v;p[i*4+3]=255}
      x.putImageData(d,0,0);try{bwCache[k]=c.toDataURL('image/png')}catch(e){bwCache[k]=''}res(bwCache[k]);
    };
    im.onerror=()=>res('');im.src=src;
  });
}

const ascii=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'');
const pixTxt=t=>ascii(t).toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();

function pixKeyNorm(k,t){
  k=String(k||'').trim();const d=k.replace(/\D/g,'');
  if(t=='cpf')return d.length==11?d:'';if(t=='cnpj')return d.length==14?d:'';
  if(t=='cel'){const n=d.length>=12&&d.startsWith('55')?d.slice(2):d;return n.length==10||n.length==11?'+55'+n:''}

}
function pixCode(o){
  const key=pixKeyNorm(EMP.pix,EMP.pixT||'cnpj');if(!key)return '';
  const nome=pixTxt(EMP.n).slice(0,25)||'LOJA',cid=pixTxt(String(EMP.c||'').split('/')[0]).slice(0,15)||'BRASIL';
  const val=r2(o.total||0),txid=('PED'+String(o.id).replace(/[^A-Za-z0-9]/g,'').slice(-10)).toUpperCase();
  const p='000201010211'+tlv('26',tlv('00','BR.GOV.BCB.PIX')+tlv('01',key))+'52040000'+'5303986'+(val>0?tlv('54',val.toFixed(2)):'')+'5802BR'+tlv('59',nome)+tlv('60',cid)+tlv('62',tlv('05',txid))+'6304';

function qrSvg(q){const n=q.length,mg=4;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q[r][c])d+=`M${c+mg} ${r+mg}h1v1h-1z`;return `<svg viewBox="0 0 ${n+2*mg} ${n+2*mg}" shape-rendering="crispEdges" role="img" aria-label="QR Code Pix"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
function qrMatrix(text){

  const AP=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66]];
  let v=1;for(;v<=14;v++){const cap=T[v][1].reduce((s,[k,d])=>s+k*d,0);if(4+(v<10?8:16)+data.length*8<=cap*8)break}
  if(v>14)return null;
  const [ecn,blk]=T[v],total=blk.reduce((s,[k,d])=>s+k*d,0);

  put(0,Math.min(4,total*8-bb.length));while(bb.length%8)bb.push(0);
  const cw=[];for(let i=0;i<bb.length;i+=8)cw.push(parseInt(bb.slice(i,i+8).join(''),2));
  for(let p=0;cw.length<total;p^=1)cw.push(p?0x11:0xEC);
  const exp=[],log=[];let x=1;
  for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&256)x^=0x11D}
  for(let i=255;i<512;i++)exp[i]=exp[i-255];
  const mul=(a,b)=>a&&b?exp[log[a]+log[b]]:0;
  let g=[1];
  for(let i=0;i<ecn;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],exp[i])}g=ng}
  const rs=d=>{const r=new Array(ecn).fill(0);for(const b of d){const f=b^r[0];r.shift();r.push(0);if(f)for(let j=0;j<ecn;j++)r[j]^=mul(g[j+1],f)}return r};
  const blocks=[];let p0=0;
  for(const [k,d] of blk)for(let i=0;i<k;i++){blocks.push(cw.slice(p0,p0+d));p0+=d}
  const ecs=blocks.map(rs),out=[],maxd=Math.max(...blocks.map(b=>b.length));
  for(let i=0;i<maxd;i++)blocks.forEach(b=>{if(i<b.length)out.push(b[i])});
  for(let i=0;i<ecn;i++)ecs.forEach(e=>out.push(e[i]));
  const fb=[];out.forEach(b=>{for(let i=7;i>=0;i--)fb.push((b>>i)&1)});
  const n=17+4*v,M=Array.from({length:n},()=>new Array(n).fill(0)),F=Array.from({length:n},()=>new Array(n).fill(false));
  const set=(r,c,val)=>{M[r][c]=val?1:0;F[r][c]=true};
  const finder=(r0,c0)=>{for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const r=r0+dr,c=c0+dc;if(r<0||c<0||r>=n||c>=n)continue;set(r,c,dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr==0||dr==6||dc==0||dc==6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)))}};
  finder(0,0);finder(0,n-7);finder(n-7,0);
  for(let i=8;i<n-8;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
  const ap=AP[v],last=ap[ap.length-1];
  for(const r of ap)for(const c of ap){if((r==6&&c==6)||(r==6&&c==last)||(r==last&&c==6))continue;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)set(r+dr,c+dc,Math.max(Math.abs(dr),Math.abs(dc))!=1)}
  for(let i=0;i<9;i++){if(i!=6){F[8][i]=true;F[i][8]=true}}
  for(let i=0;i<8;i++){F[8][n-1-i]=true;F[n-1-i][8]=true}
  set(n-8,8,1);
  if(v>=7){for(let i=0;i<6;i++)for(let j=0;j<3;j++){F[i][n-11+j]=true;F[n-11+j][i]=true}}
  let bi=0;
  for(let c=n-1,up=true;c>0;c-=2,up=!up){if(c==6)c=5;for(let i=0;i<n;i++){const r=up?n-1-i:i;for(let k=0;k<2;k++){const cc=c-k;if(!F[r][cc])M[r][cc]=bi<fb.length?fb[bi++]:0}}}
  const maskFn=[(r,c)=>(r+c)%2==0,(r,c)=>r%2==0,(r,c)=>c%3==0,(r,c)=>(r+c)%3==0,(r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2==0,(r,c)=>(r*c)%2+(r*c)%3==0,(r,c)=>((r*c)%2+(r*c)%3)%2==0,(r,c)=>(((r+c)%2)+(r*c)%3)%2==0];
  const withMask=mk=>{
    const m=M.map(row=>row.slice());
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!F[r][c]&&maskFn[mk](r,c))m[r][c]^=1;
    let rem=mk<<10;for(let i=14;i>=10;i--)if((rem>>i)&1)rem^=0x537<<(i-10);
    const bits=((mk<<10)|rem)^0x5412,b=i=>(bits>>i)&1;
    for(let i=0;i<=5;i++)m[i][8]=b(i);
    m[7][8]=b(6);m[8][8]=b(7);m[8][7]=b(8);
    for(let i=9;i<15;i++)m[8][14-i]=b(i);
    for(let i=0;i<8;i++)m[8][n-1-i]=b(i);
    for(let i=8;i<15;i++)m[n-15+i][8]=b(i);
    m[n-8][8]=1;
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>11)*0x1F25);const vb=(v<<12)|r;for(let i=0;i<18;i++){const bit=(vb>>i)&1,a=n-11+i%3,q=Math.floor(i/3);m[q][a]=bit;m[a][q]=bit}}
    return m;
  };
  const penalty=m=>{
    let pen=0,dark=0;
    const line=get=>{let run=1,prev=get(0),s=''+prev;for(let i=1;i<n;i++){const cur=get(i);s+=cur;if(cur==prev)run++;else{if(run>=5)pen+=3+run-5;run=1;prev=cur}}if(run>=5)pen+=3+run-5;for(let i=0;i+11<=n;i++){const w=s.substr(i,11);if(w=='10111010000'||w=='00001011101')pen+=40}};
    for(let r=0;r<n;r++){line(i=>m[r][i]);line(i=>m[i][r]);for(let c=0;c<n;c++){dark+=m[r][c];if(r<n-1&&c<n-1&&m[r][c]==m[r][c+1]&&m[r][c]==m[r+1][c]&&m[r][c]==m[r+1][c+1])pen+=3}}
    pen+=(Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10;return pen;
  };
  let best=null,bp=1e9;for(let mk=0;mk<8;mk++){const m=withMask(mk),pn=penalty(m);if(pn<bp){bp=pn;best=m}}
  return best;
}
